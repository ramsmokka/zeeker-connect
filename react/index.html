<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            background: '#0B0E11', // Deep dark background from screenshot
            surface: '#151A21', // Slightly lighter for cards
            primary: '#6366F1', // Indigo/Purple accent
            secondary: '#A855F7',
            accent: '#EC4899',
          },
          animation: {
            'gradient-x': 'gradient-x 3s ease infinite',
            'slide-up': 'slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            'gradient-x': {
              '0%, 100%': {
                'background-size': '200% 200%',
                'background-position': 'left center'
              },
              '50%': {
                'background-size': '200% 200%',
                'background-position': 'right center'
              },
            },
            'slide-up': {
              '0%': { transform: 'translateY(100%)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #0B0E11;
      color: #F3F4F6;
    }

    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }

    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Rich Text Editor Placeholder */
    .rich-editor:empty:before {
      content: attr(data-placeholder);
      color: #9CA3AF;
      pointer-events: none;
    }

    /* Rich Text Content Styling (Prose Lite) */
    .prose-lite h1 {
      font-size: 1.5em;
      font-weight: 800;
      margin-bottom: 0.5em;
      line-height: 1.2;
    }

    .prose-lite h2 {
      font-size: 1.25em;
      font-weight: 700;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    .prose-lite ul {
      list-style-type: disc;
      padding-left: 1.5em;
      margin-bottom: 0.5em;
    }

    .prose-lite ol {
      list-style-type: decimal;
      padding-left: 1.5em;
      margin-bottom: 0.5em;
    }

    .prose-lite blockquote {
      border-left: 3px solid #6366F1;
      padding-left: 1em;
      font-style: italic;
      color: #6B7280;
    }

    .dark .prose-lite blockquote {
      color: #9CA3AF;
    }

    .prose-lite pre {
      background: #1F2937;
      padding: 0.75em;
      border-radius: 0.5em;
      overflow-x: auto;
      margin-bottom: 0.5em;
      color: #E5E7EB;
      font-family: monospace;
    }

    .prose-lite code {
      background: #F3F4F6;
      padding: 0.1em 0.3em;
      border-radius: 0.25em;
      font-family: monospace;
      font-size: 0.9em;
      color: #DC2626;
    }

    .dark .prose-lite code {
      background: #374151;
      color: #F87171;
    }

    .prose-lite a {
      color: #6366F1;
      text-decoration: underline;
    }

    .prose-lite p {
      margin-bottom: 0.5em;
    }

    .prose-lite p:last-child {
      margin-bottom: 0;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
